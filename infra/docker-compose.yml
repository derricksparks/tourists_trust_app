# Local development database. Production hosting is chosen separately (see docs/BUILD_SPEC.md, B5).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ttp
      POSTGRES_PASSWORD: ttp
      POSTGRES_DB: ttp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
