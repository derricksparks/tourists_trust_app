name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgresql://ttp:ttp@localhost:5432/ttp_test
  TEST_DATABASE_URL: postgresql://ttp:ttp@localhost:5432/ttp_test
  JWT_SECRET: ci-only-secret-at-least-16-chars

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ttp
          POSTGRES_PASSWORD: ttp
          POSTGRES_DB: ttp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ttp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ttp/shared-types build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @ttp/web-content build
      - run: pnpm --filter @ttp/admin build
      - run: pnpm --filter @ttp/telegram-bot build
      - run: pnpm --filter @ttp/portal build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ttp
          POSTGRES_PASSWORD: ttp
          POSTGRES_DB: ttp_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ttp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ttp:ttp@localhost:5432/ttp_e2e
      TELEGRAM_BOT_TOKEN: "123456:CI-placeholder-token"
      REVALIDATE_SECRET: ci-revalidate-secret
      WEB_REVALIDATE_URL: http://localhost:3001/api/revalidate
      API_URL: http://localhost:3000
      SITE_URL: http://localhost:3001
      # Browser tests run a stand-in for Telegram on 8099 (apps/web-content/e2e/fake-telegram.mjs)
      TELEGRAM_API_BASE: http://localhost:8099
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ttp/shared-types build
      - run: pnpm --filter @ttp/api prisma:deploy
      - run: pnpm --filter @ttp/api build
      - run: pnpm --filter @ttp/web-content build
      - name: Start API
        working-directory: services/api
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - run: pnpm --filter @ttp/admin exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/admin/test-results
            apps/web-content/test-results

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the production compose file
        working-directory: infra/production
        run: cp .env.example .env && sed -i 's/^\(POSTGRES_PASSWORD\|JWT_SECRET\|REVALIDATE_SECRET\)=$/\1=ci-placeholder/' .env && docker compose config --quiet
      - name: Build the production images
        run: |
          docker build --target app --build-arg SITE_URL=https://example.org -t ttp-app .
          docker build --target proxy --build-arg SITE_URL=https://example.org -t ttp-proxy .
      - name: Validate the Caddy configuration
        run: >
          docker run --rm -e SITE_DOMAIN=example.org -e ADMIN_DOMAIN=admin.example.org -e PORTAL_DOMAIN=partners.example.org
          -e ACME_EMAIL=ci@example.org ttp-proxy caddy validate --config /etc/caddy/Caddyfile
      - name: The setup command is in the image
        run: |
          out=$(docker run --rm ttp-app node /app/services/api/dist/cli/setup.js 2>&1 || true)
          echo "$out" | grep -q Usage
