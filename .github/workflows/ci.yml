name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ttp
          POSTGRES_PASSWORD: ttp
          POSTGRES_DB: ttp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ttp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ttp:ttp@localhost:5432/ttp_test
      TEST_DATABASE_URL: postgresql://ttp:ttp@localhost:5432/ttp_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ttp/shared-types build
      - run: pnpm typecheck
      - run: pnpm test
