name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgresql://ttp:ttp@localhost:5432/ttp_test
  TEST_DATABASE_URL: postgresql://ttp:ttp@localhost:5432/ttp_test
  JWT_SECRET: ci-only-secret-at-least-16-chars

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ttp
          POSTGRES_PASSWORD: ttp
          POSTGRES_DB: ttp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ttp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ttp/shared-types build
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ttp
          POSTGRES_PASSWORD: ttp
          POSTGRES_DB: ttp_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ttp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ttp:ttp@localhost:5432/ttp_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ttp/shared-types build
      - run: pnpm --filter @ttp/api prisma:deploy
      - run: pnpm --filter @ttp/api build
      - name: Start API
        working-directory: services/api
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - run: pnpm --filter @ttp/admin exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/admin/test-results
